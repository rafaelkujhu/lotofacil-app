<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lotofácil">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Lotofácil App</title>

<style>
:root{
  --roxo:#6a1b9a;
  --roxo2:#8e24aa;
  --claro:#f3e5f5;
}
  

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:linear-gradient(180deg,var(--roxo),var(--roxo2));
  color:#333;
}

.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  border-radius:20px 20px 0 0;
  overflow:hidden;
}

header{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  padding:20px;
  text-align:center;
  font-size:20px;
  font-weight:600;
}

.tabs{
  display:flex;
  background:#eee;
}

.tab{
  flex:1;
  padding:14px;
  text-align:center;
  font-weight:600;
  cursor:pointer;
}

.tab.active{
  background:#fff;
  color:var(--roxo);
  border-bottom:3px solid var(--roxo);
}

.content{
  padding:20px;
}

textarea,input,select{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:16px;
}

button{
  width:100%;
  padding:16px;
  margin-top:15px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  font-size:17px;
  font-weight:600;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.resultado{
  background:var(--claro);
  padding:14px;
  border-radius:12px;
  margin-top:12px;
  color:#4a148c;
  font-weight:600;
  text-align:center;
  animation:fade .3s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1}
}

.footer{
  text-align:center;
  font-size:12px;
  color:#888;
  padding:15px;
}
</style>
</head>

<body>

<div class="app">
<header>🎯 Lotofácil Inteligente</header>

<div class="tabs">
  <div class="tab active" onclick="trocarTab(0)">📊 Estatística</div>
  <div class="tab" onclick="trocarTab(1)">🎲 Aleatório</div>
</div>

<div class="content" id="tab0">
  <p>Cole até 100 concursos (um por linha):</p>
  <textarea id="resultados" rows="5"
  placeholder="01 02 03 04 05 06 07 08 09 10 11 12 13 14 15"></textarea>

  <input type="number" id="qtdJogos" value="5" min="1" max="50"
  placeholder="Quantidade de jogos">

  <select id="qtdNums">
    <option value="15">15 números</option>
    <option value="16">16 números</option>
    <option value="17">17 números</option>
    <option value="18">18 números</option>
  </select>

  <button onclick="gerarEstatistico()">Gerar Jogos Estatísticos</button>
</div>

<div class="content" id="tab1" style="display:none">
  <input type="number" id="qtdJogosA" value="5" min="1" max="50">
  <select id="qtdNumsA">
    <option value="15">15 números</option>
    <option value="16">16 números</option>
    <option value="17">17 números</option>
    <option value="18">18 números</option>
  </select>

  <button onclick="gerarAleatorio()">Gerar Jogos Aleatórios</button>
</div>

<div class="content">
  <h3>🧾 Jogos Gerados</h3>
  <div id="saida"></div>
</div>

<div class="footer">
  App Lotofácil • Estatística Inteligente
</div>
</div>

<script>
function trocarTab(i){
  document.querySelectorAll('.tab').forEach((t,idx)=>{
    t.classList.toggle('active',idx===i);
    document.getElementById('tab'+idx).style.display =
      idx===i?'block':'none';
  });
}

function parseResultados(){
  let t=document.getElementById('resultados').value.trim();
  if(!t)return[];
  return t.split("\n").map(l=>l.trim().split(/\s+/).map(Number));
}

function rankingPonderado(jogos){
  let pesos = {};
  for(let i=1;i<=25;i++) pesos[i]=0;

  jogos.forEach((jogo, idx)=>{
    let peso = 1;
    if(idx >= jogos.length-10) peso = 3;
    else if(idx >= jogos.length-30) peso = 2;

    jogo.forEach(n=>{
      pesos[n] += peso;
    });
  });

  return Object.keys(pesos)
    .sort((a,b)=>pesos[b]-pesos[a])
    .map(Number);
}

function gerarEstatistico(){
  let jogos = parseResultados();
  if(jogos.length < 5){
    alert("Cole pelo menos 5 concursos.");
    return;
  }

  let qJ = +qtdJogos.value;
  let qN = +qtdNums.value;
  let ranking = rankingPonderado(jogos);
  let out = "";

  for(let i=0;i<qJ;i++){
    let jogo = [];

    let fixos = Math.floor(qN * 0.7);
    while(jogo.length < fixos){
      let n = ranking[Math.floor(Math.random()*10)];
      if(!jogo.includes(n)) jogo.push(n);
    }

    while(jogo.length < qN){
      let n = Math.floor(Math.random()*25)+1;
      if(!jogo.includes(n)) jogo.push(n);
    }

    jogo.sort((a,b)=>a-b);
    out += <div class="resultado">${jogo.map(n=>String(n).padStart(2,"0")).join(" - ")}</div>;
  }

  saida.innerHTML = out;
}
    }
    jogo.sort((a,b)=>a-b);
    out+=`<div class="resultado">${jogo.map(n=>String(n).padStart(2,"0")).join(" - ")}</div>`;
  }
  saida.innerHTML=out;
}

function gerarAleatorio(){
  let qJ=+qtdJogosA.value,qN=+qtdNumsA.value,out="";
  for(let i=0;i<qJ;i++){
    let jogo=[];
    while(jogo.length<qN){
      let n=Math.floor(Math.random()*25)+1;
      if(!jogo.includes(n))jogo.push(n);
    }
    jogo.sort((a,b)=>a-b);
    out+=`<div class="resultado">${jogo.map(n=>String(n).padStart(2,"0")).join(" - ")}</div>`;
  }
  saida.innerHTML=out;
}
</script>

</body>
</html>
