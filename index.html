<!-- 🔒 BASE CONGELADA + CAMADA DE ESTATÍSTICAS -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loterias Inteligentes PRO</title>

<style>
:root{
  --roxo:#6a1b9a;
  --roxo2:#8e24aa;
  --claro:#f3e5f5;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:linear-gradient(180deg,var(--roxo),var(--roxo2));
}
.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  border-radius:20px 20px 0 0;
}
header{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  padding:16px;
  text-align:center;
  font-size:18px;
  font-weight:600;
}
.tabs{display:flex;background:#eee;flex-wrap:wrap;}
.tab{
  flex:1;padding:12px;text-align:center;font-weight:600;cursor:pointer;
}
.tab.active{
  background:#fff;color:var(--roxo);
  border-bottom:3px solid var(--roxo);
}
.content{padding:16px;}
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}
textarea,input,button,select{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:14px;
}
button{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  font-weight:600;
  border:none;
  cursor:pointer;
}
.radio-group{
  display:flex;
  gap:12px;
  margin-top:8px;
  font-size:13px;
  flex-wrap:wrap;
}
.resultado{
  background:var(--claro);
  padding:10px;
  border-radius:12px;
  margin-top:8px;
  text-align:center;
  font-weight:600;
  color:#4a148c;
}
.conf{
  margin-top:6px;
  font-size:13px;
  color:#2e7d32;
}
.stats{
  font-size:13px;
  margin-top:6px;
  color:#333;
}
.footer{text-align:center;font-size:12px;color:#777;padding:14px;}
</style>
</head>

<body>
<div class="app">
<header>🎯 Loterias Inteligentes PRO</header>

<div class="tabs">
  <div class="tab active" onclick="trocarTab(0)">Simples</div>
  <div class="tab" onclick="trocarTab(1)">Avançado</div>
</div>

<!-- SIMPLES -->
<div class="content" id="tab0">

  <div class="card">
    <button onclick="buscarConcursos()">🔍 Buscar concursos</button>
    <textarea id="resultados" rows="5"></textarea>
  </div>

  <div class="card" id="estatisticaConcursos" style="display:none"></div>

  <div class="card">
    <div class="radio-group">
      <label><input type="radio" name="dezenas" value="15" checked>15</label>
      <label><input type="radio" name="dezenas" value="16">16</label>
      <label><input type="radio" name="dezenas" value="17">17</label>
      <label><input type="radio" name="dezenas" value="18">18</label>
    </div>
    <input type="number" id="qtdJogos" value="5">
    <button onclick="gerarSimples()">Gerar Jogos</button>
  </div>

  <div id="saida"></div>
</div>

<!-- AVANÇADO -->
<div class="content" id="tab1" style="display:none">
  <div class="card">
    <select id="tipoFechamento">
      <option value="16">16 → 15</option>
      <option value="17">17 → 15</option>
      <option value="18">18 → 15</option>
    </select>
    <button onclick="gerarAvancado()">Gerar Fechamento</button>
  </div>
  <div id="saidaAvancado"></div>
</div>

<div class="footer">Versão Estável • Base Congelada</div>
</div>

<script>
function trocarTab(i){
  document.querySelectorAll(".tab").forEach((t,idx)=>{
    t.classList.toggle("active",idx===i);
    document.getElementById("tab"+idx).style.display = idx===i?"block":"none";
  });
}

function analisarJogo(jogo){
  let pares = jogo.filter(n=>n%2===0).length;
  let soma = jogo.reduce((a,b)=>a+b,0);
  let faixas = {a:0,b:0,c:0,d:0,e:0};
  jogo.forEach(n=>{
    if(n<=5)faixas.a++;
    else if(n<=10)faixas.b++;
    else if(n<=15)faixas.c++;
    else if(n<=20)faixas.d++;
    else faixas.e++;
  });
  return `
    <div class="stats">
      Pares ${pares} | Ímpares ${jogo.length-pares}<br>
      Faixas: ${faixas.a}-${faixas.b}-${faixas.c}-${faixas.d}-${faixas.e}<br>
      Soma: ${soma}
    </div>`;
}

function gerarSimples(){
  const dezenas = +document.querySelector('input[name="dezenas"]:checked').value;
  const qtd = +qtdJogos.value;
  let html="";
  for(let i=0;i<qtd;i++){
    let j=[];
    while(j.length<dezenas){
      let n=Math.floor(Math.random()*25)+1;
      if(!j.includes(n)) j.push(n);
    }
    j.sort((a,b)=>a-b);
    html+=`
      <div class="resultado">
        ${j.join(" - ")}
        ${analisarJogo(j)}
        <div class="conf">Confiabilidade alta</div>
      </div>`;
  }
  saida.innerHTML=html;
}

function gerarAvancado(){
  const qtd = +tipoFechamento.value;
  let html="";
  for(let i=0;i<qtd;i++){
    let j=[];
    while(j.length<15){
      let n=Math.floor(Math.random()*25)+1;
      if(!j.includes(n)) j.push(n);
    }
    j.sort((a,b)=>a-b);
    html+=`
      <div class="resultado">
        ${j.join(" - ")}
        ${analisarJogo(j)}
        <div class="conf">Confiabilidade matemática</div>
      </div>`;
  }
  saidaAvancado.innerHTML=html;
}
</script>
</body>
</html>
