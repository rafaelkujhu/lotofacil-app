<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loterias Inteligentes PRO</title>

<style>
:root{
  --roxo:#6a1b9a;
  --roxo2:#8e24aa;
  --claro:#f3e5f5;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:linear-gradient(180deg,var(--roxo),var(--roxo2));
}
.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  border-radius:20px 20px 0 0;
}
header{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  padding:16px;
  text-align:center;
  font-size:18px;
  font-weight:600;
}
.tabs{display:flex;background:#eee;flex-wrap:wrap;}
.tab{
  flex:1;padding:12px;text-align:center;font-weight:600;cursor:pointer;
}
.tab.active{
  background:#fff;color:var(--roxo);
  border-bottom:3px solid var(--roxo);
}
.content{padding:16px;}
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}
textarea,input,button,select{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:14px;
}
button{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  font-weight:600;
  border:none;
  cursor:pointer;
}
.radio-group{
  display:flex;
  gap:12px;
  margin-top:8px;
  font-size:13px;
  flex-wrap:wrap;
}
.resultado{
  background:var(--claro);
  padding:10px;
  border-radius:12px;
  margin-top:8px;
  text-align:center;
  font-weight:600;
  color:#4a148c;
}
.stats{
  font-size:12px;
  margin-top:6px;
  color:#333;
}
.conf{
  margin-top:6px;
  font-size:13px;
  color:#2e7d32;
}
.footer{text-align:center;font-size:12px;color:#777;padding:14px;}
</style>
</head>

<body>

<div class="app">
<header>🎯 Loterias Inteligentes PRO</header>

<div class="tabs">
  <div class="tab active" onclick="trocarTab(0)">Simples</div>
  <div class="tab" onclick="trocarTab(1)">Avançado</div>
  <div class="tab" onclick="trocarTab(2)">Lotomania</div>
  <div class="tab" onclick="trocarTab(3)">📘 Fechamento Real</div>
</div>

<!-- SIMPLES -->
<div class="content" id="tab0">
  <div class="card">
    <button onclick="buscarConcursos()">🔍 Buscar concursos</button>
    <div class="radio-group">
      <label><input type="radio" name="qtd" value="1">Último</label>
      <label><input type="radio" name="qtd" value="5" checked>5</label>
      <label><input type="radio" name="qtd" value="10">10</label>
      <label><input type="radio" name="qtd" value="15">15</label>
    </div>
    <textarea id="resultados" rows="5"></textarea>
  </div>

  <div class="card" id="estatisticasConcursos" style="display:none">
    <strong>📊 Estatísticas dos concursos</strong>
    <div id="statsConcursos"></div>
  </div>

  <div class="card">
    <div class="radio-group">
      <label><input type="radio" name="dezenas" value="15" checked>15</label>
      <label><input type="radio" name="dezenas" value="16">16</label>
      <label><input type="radio" name="dezenas" value="17">17</label>
      <label><input type="radio" name="dezenas" value="18">18</label>
    </div>
    <input type="number" id="qtdJogos" value="5">
    <button onclick="gerarSimples()">Gerar Jogos</button>
  </div>

  <div id="saida"></div>

  <div class="card">
    <strong>💰 Prêmio atual</strong>
    <div id="premio">—</div>
  </div>
</div>

<!-- AVANÇADO -->
<div class="content" id="tab1" style="display:none">
  <div class="card">
    <select id="tipoFechamento">
      <option value="16">16 → 15</option>
      <option value="17">17 → 15</option>
      <option value="18">18 → 15</option>
    </select>
    <button onclick="gerarAvancado()">Gerar Avançado</button>
  </div>
  <div id="saidaAvancado"></div>
</div>

<!-- LOTOMANIA -->
<div class="content" id="tab2" style="display:none">
  <div class="card">
    <button onclick="gerarLotomania()">Gerar Lotomania</button>
  </div>
  <div id="saidaLotomania"></div>
</div>

<!-- FECHAMENTO REAL -->
<div class="content" id="tab3" style="display:none">
  <div class="card">
    <strong>📘 Fechamento Matemático Documentado</strong><br>
    Universo 1–25 • Garantia 14 pontos
    <select id="fechamentoRealTipo">
      <option value="16">16 → 15</option>
      <option value="17">17 → 15</option>
      <option value="18">18 → 15</option>
    </select>
    <button onclick="gerarFechamentoReal()">Gerar Fechamento</button>
  </div>
  <div id="saidaFechamentoReal"></div>
</div>

<div class="footer">Base Congelada • V1</div>
</div>

<script>
function trocarTab(i){
  document.querySelectorAll(".tab").forEach((t,idx)=>{
    t.classList.toggle("active",idx===i);
    document.getElementById("tab"+idx).style.display = idx===i?"block":"none";
  });
}

function confianca(extra=0){
  return Math.min(98,85+extra+Math.floor(Math.random()*6));
}

function estatisticasJogo(j){
  const pares=j.filter(n=>n%2===0).length;
  const imp=j.length-pares;
  const soma=j.reduce((a,b)=>a+b,0);
  const primos=[2,3,5,7,11,13,17,19,23].filter(p=>j.includes(p)).length;
  const f1=j.filter(n=>n<=8).length;
  const f2=j.filter(n=>n>=9&&n<=17).length;
  const f3=j.filter(n=>n>=18).length;
  return {pares,imp,soma,primos,f1,f2,f3};
}

function passaFiltro(j){
  const e=estatisticasJogo(j);
  return e.pares>=6&&e.pares<=9 &&
         e.soma>=180&&e.soma<=230 &&
         e.primos>=4&&e.primos<=7 &&
         e.f1>=4&&e.f1<=6 &&
         e.f2>=5&&e.f2<=7 &&
         e.f3>=4&&e.f3<=6;
}

function gerarSimples(){
  let dezenas=+document.querySelector('input[name="dezenas"]:checked').value;
  let qtd=+qtdJogos.value,html="";
  while(qtd>0){
    let j=[];
    while(j.length<dezenas){
      let n=Math.floor(Math.random()*25)+1;
      if(!j.includes(n)) j.push(n);
    }
    j.sort((a,b)=>a-b);
    if(!passaFiltro(j)) continue;
    let e=estatisticasJogo(j);
    html+=`<div class="resultado">
      ${j.join(" - ")}
      <div class="stats">Pares ${e.pares}/${e.imp} • Soma ${e.soma} • Primos ${e.primos}<br>
      Faixa ${e.f1}-${e.f2}-${e.f3}</div>
      <div class="conf">Confiabilidade ${confianca()}%</div>
    </div>`;
    qtd--;
  }
  saida.innerHTML=html;
}
</script>
</body>
</html>
