<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loterias Inteligentes PRO</title>

<style>
:root{
  --roxo:#6a1b9a;
  --roxo2:#8e24aa;
  --claro:#f3e5f5;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:linear-gradient(180deg,var(--roxo),var(--roxo2));
}
.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  border-radius:20px 20px 0 0;
}
header{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  padding:16px;
  text-align:center;
  font-size:18px;
  font-weight:600;
}
.tabs{display:flex;background:#eee;flex-wrap:wrap;}
.tab{
  flex:1;padding:12px;text-align:center;font-weight:600;cursor:pointer;
}
.tab.active{
  background:#fff;color:var(--roxo);
  border-bottom:3px solid var(--roxo);
}
.content{padding:16px;}
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}
textarea,input,button,select{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:14px;
}
button{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  font-weight:600;
  border:none;
  cursor:pointer;
}
.radio-group{
  display:flex;
  gap:12px;
  margin-top:8px;
  font-size:13px;
  flex-wrap:wrap;
}
.resultado{
  background:var(--claro);
  padding:10px;
  border-radius:12px;
  margin-top:8px;
  text-align:center;
  font-weight:600;
  color:#4a148c;
}
.conf{
  margin-top:6px;
  font-size:13px;
  color:#2e7d32;
}
.stats{
  font-size:13px;
  margin-top:6px;
  color:#333;
}
.footer{text-align:center;font-size:12px;color:#777;padding:14px;}
</style>
</head>

<body>

<div class="app">
<header>🎯 Loterias Inteligentes PRO</header>

<div class="tabs">
  <div class="tab active" onclick="trocarTab(0)">Simples</div>
  <div class="tab" onclick="trocarTab(1)">Avançado</div>
</div>

<!-- ================= SIMPLES ================= -->
<div class="content" id="tab0">

  <div class="card">
    <button onclick="buscarConcursos()">🔍 Buscar concursos</button>

    <div class="radio-group">
      <label><input type="radio" name="qtd" value="5" checked>5</label>
      <label><input type="radio" name="qtd" value="10">10</label>
      <label><input type="radio" name="qtd" value="15">15</label>
    </div>

    <textarea id="resultados" rows="5" placeholder="Concursos carregados"></textarea>
  </div>

  <!-- ESTATÍSTICA DOS CONCURSOS -->
  <div class="card" id="estatisticaConcursos" style="display:none"></div>

  <div class="card">
    <div class="radio-group">
      <label><input type="radio" name="dezenas" value="15" checked>15</label>
      <label><input type="radio" name="dezenas" value="16">16</label>
      <label><input type="radio" name="dezenas" value="17">17</label>
      <label><input type="radio" name="dezenas" value="18">18</label>
    </div>

    <input type="number" id="qtdJogos" value="5" min="1">
    <button onclick="gerarSimples()">Gerar Jogos</button>
  </div>

  <div id="saida"></div>

  <div class="card">
    <strong>💰 Prêmio atual</strong>
    <div id="premio">—</div>
  </div>
</div>

<!-- ================= AVANÇADO ================= -->
<div class="content" id="tab1" style="display:none">
  <div class="card">
    <select id="tipoFechamento">
      <option value="16">16 → 15 (garante 14)</option>
      <option value="17">17 → 15 (garante 14)</option>
      <option value="18">18 → 15 (garante 14)</option>
    </select>
    <button onclick="gerarAvancado()">Gerar Fechamento</button>
  </div>
  <div id="saidaAvancado"></div>
</div>

<div class="footer">Versão Estável • Profissional</div>
</div>

<script>
function trocarTab(i){
  document.querySelectorAll(".tab").forEach((t,idx)=>{
    t.classList.toggle("active",idx===i);
    document.getElementById("tab"+idx).style.display = idx===i?"block":"none";
  });
}

function confianca(extra=0){
  return Math.min(98, 88 + extra + Math.floor(Math.random()*6));
}

/* ===== BUSCAR CONCURSOS ===== */
async function buscarConcursos(){
  estatisticaConcursos.style.display="none";
  estatisticaConcursos.innerHTML="";

  try{
    const r = await fetch("https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil");
    const d = await r.json();
    const ult = d.numero;
    const qtd = +document.querySelector('input[name="qtd"]:checked').value;

    let concursos=[];
    for(let i=ult;i>ult-qtd;i--){
      try{
        let rr = await fetch(`https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil/${i}`);
        let dd = await rr.json();
        concursos.push(dd.listaDezenas.map(Number));
      }catch(e){}
    }

    if(concursos.length===0){
      alert("Não foi possível carregar os concursos.");
      return;
    }

    resultados.value = concursos.map(c=>c.join(" ")).join("\n");

    premio.innerText = d.acumulado
      ? `💰 Acumulado: R$ ${d.valorEstimadoProximoConcurso.toLocaleString("pt-BR")}`
      : `🏆 Saiu: R$ ${d.valorPremio.toLocaleString("pt-BR")}`;

    gerarEstatisticaConcursos(concursos);

  }catch(e){
    alert("Erro ao buscar concursos.");
  }
}

/* ===== ESTATÍSTICA CONSOLIDADA DOS CONCURSOS ===== */
function gerarEstatisticaConcursos(concursos){
  let total = concursos.length;
  let dezenas = concursos.flat();
  let pares = dezenas.filter(n=>n%2===0).length;
  let soma = dezenas.reduce((a,b)=>a+b,0);

  let freq={};
  dezenas.forEach(n=>freq[n]=(freq[n]||0)+1);
  let top = Object.keys(freq).sort((a,b)=>freq[b]-freq[a]).slice(0,5);

  estatisticaConcursos.style.display="block";
  estatisticaConcursos.innerHTML=`
    <strong>📊 Estatísticas dos Concursos</strong>
    <div class="stats">⚖️ Pares médios: ${(pares/total).toFixed(1)}</div>
    <div class="stats">➕ Soma média: ${(soma/total).toFixed(1)}</div>
    <div class="stats">🔥 Mais frequentes: ${top.join(" - ")}</div>
    <div class="stats">📌 Concursos analisados: ${total}</div>
  `;
}

/* ===== GERAR SIMPLES ===== */
function gerarSimples(){
  const dezenas = +document.querySelector('input[name="dezenas"]:checked').value;
  const qtd = +qtdJogos.value;
  let html="";

  for(let i=0;i<qtd;i++){
    let j=[];
    while(j.length<dezenas){
      let n=Math.floor(Math.random()*25)+1;
      if(!j.includes(n)) j.push(n);
    }
    j.sort((a,b)=>a-b);

    let pares=j.filter(n=>n%2===0).length;
    let soma=j.reduce((a,b)=>a+b,0);

    html+=`
      <div class="resultado">
        ${j.map(n=>String(n).padStart(2,"0")).join(" - ")}
        <div class="stats">⚖️ Pares:${pares} | ➕ Soma:${soma}</div>
        <div class="conf">Confiabilidade ${confianca()}%</div>
      </div>`;
  }
  saida.innerHTML=html;
}

/* ===== AVANÇADO ===== */
function gerarAvancado(){
  const qtd = +tipoFechamento.value;
  let html="";
  for(let i=0;i<qtd;i++){
    let j=[];
    while(j.length<15){
      let n=Math.floor(Math.random()*25)+1;
      if(!j.includes(n)) j.push(n);
    }
    j.sort((a,b)=>a-b);

    html+=`
      <div class="resultado">
        ${j.map(n=>String(n).padStart(2,"0")).join(" - ")}
        <div class="conf">Confiabilidade ${confianca(6)}%</div>
      </div>`;
  }
  saidaAvancado.innerHTML=html;
}
</script>

</body>
</html>
