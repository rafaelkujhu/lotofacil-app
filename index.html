<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loterias Inteligentes</title>

<style>
:root{
  --roxo:#6a1b9a;
  --roxo2:#8e24aa;
  --claro:#f3e5f5;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:linear-gradient(180deg,var(--roxo),var(--roxo2));
}
.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  border-radius:20px 20px 0 0;
}
header{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  padding:16px;
  text-align:center;
  font-size:18px;
  font-weight:600;
}
.tabs{display:flex;background:#eee;}
.tab{
  flex:1;padding:14px;text-align:center;font-weight:600;cursor:pointer;
}
.tab.active{
  background:#fff;color:var(--roxo);
  border-bottom:3px solid var(--roxo);
}
.content{padding:16px;}
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}
textarea,input,button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:15px;
}
button{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  font-weight:600;
  border:none;
  cursor:pointer;
}
.radio-group{
  display:flex;
  gap:16px;
  margin-top:10px;
  font-size:14px;
  flex-wrap:wrap;
}
.resultado{
  background:var(--claro);
  padding:12px;
  border-radius:12px;
  margin-top:10px;
  text-align:center;
  font-weight:600;
  color:#4a148c;
}
.conf{
  margin-top:6px;
  font-size:14px;
  color:#2e7d32;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
}
.bolinha{
  width:12px;height:12px;border-radius:50%;background:#2e7d32;
}
.footer{text-align:center;font-size:12px;color:#777;padding:14px;}
</style>
</head>

<body>

<div class="app">
<header>🎯 Loterias Inteligentes</header>

<div class="tabs">
  <div class="tab active" onclick="trocarTab(0)">Lotofácil</div>
  <div class="tab" onclick="trocarTab(1)">Lotomania</div>
</div>

<!-- LOTOFÁCIL -->
<div class="content" id="tab0">

  <div class="card">
    <button onclick="buscarUltimos()">📥 Buscar concursos</button>

    <!-- FILTRO DE QUANTIDADE DE CONCURSOS -->
    <div class="radio-group">
      <label><input type="radio" name="qtd" value="5" checked> Últimos 5</label>
      <label><input type="radio" name="qtd" value="10"> Últimos 10</label>
      <label><input type="radio" name="qtd" value="15"> Últimos 15</label>
    </div>

    <textarea id="resultados" rows="6"
      placeholder="Concursos carregados automaticamente"></textarea>
  </div>

  <!-- MODOS (ACRESCENTADOS) -->
  <div class="card">
    <div class="radio-group">
      <label>
        <input type="radio" name="modo" value="estatistico" checked>
        📊 Estatístico
      </label>
      <label>
        <input type="radio" name="modo" value="livre">
        🎲 Livre
      </label>
    </div>
  </div>

  <div class="card">
    <input type="number" id="qtdJogos" value="5" min="1" max="20">
    <button onclick="gerarFechamento()">🎯 Gerar Jogos</button>
  </div>

  <div id="saida"></div>

  <div class="card">
    <strong>💰 Prêmio atual</strong>
    <div id="premio">Carregando...</div>
  </div>
</div>

<!-- LOTOMANIA -->
<div class="content" id="tab1" style="display:none">
  <div class="card">
    <input type="number" id="qtdLotomania" value="3" min="1" max="10">
    <button onclick="gerarLotomania()">🎰 Gerar Lotomania Inteligente</button>
  </div>
  <div id="saidaLotomania"></div>
</div>

<div class="footer">App de Loterias • Evolução Contínua</div>
</div>

<script>
function trocarTab(i){
  document.querySelectorAll(".tab").forEach((t,idx)=>{
    t.classList.toggle("active",idx===i);
    document.getElementById("tab"+idx).style.display =
      idx===i ? "block" : "none";
  });
}

/* BUSCAR LOTOFÁCIL */
async function buscarUltimos(){
  const r = await fetch("https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil");
  const d = await r.json();
  const ult = d.numero;
  const qtd = +document.querySelector('input[name="qtd"]:checked').value;
  let lista = [];

  for(let i=ult;i>ult-qtd;i--){
    let rr = await fetch(
      `https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil/${i}`
    );
    let dd = await rr.json();
    lista.push(dd.listaDezenas.join(" "));
  }

  resultados.value = lista.join("\n");

  premio.innerHTML = d.acumulado
    ? `🔴 Acumulado: R$ ${d.valorEstimadoProximoConcurso.toLocaleString("pt-BR")}`
    : `🟢 Saiu: R$ ${d.valorPremio.toLocaleString("pt-BR")}`;
}

/* LOTOFÁCIL – ESTATÍSTICO + LIVRE */
function gerarFechamento(){
  let modo = document.querySelector('input[name="modo"]:checked').value;
  let qtd = +qtdJogos.value;

  let ranking = [];

  if(modo === "estatistico"){
    let linhas = resultados.value.trim().split("\n").filter(l=>l);
    if(linhas.length === 0){
      alert("Busque os concursos ou use o modo Livre.");
      return;
    }

    let base = {};
    linhas.forEach(l=>{
      l.split(" ").forEach(n=>{
        base[n] = (base[n]||0) + 1;
      });
    });

    ranking = Object.keys(base)
      .sort((a,b)=>base[b]-base[a])
      .map(Number);
  } else {
    ranking = Array.from({length:25},(_,i)=>i+1);
  }

  let usados = new Set();
  let html = "";
  let tentativas = 0;

  while(usados.size < qtd && tentativas < 4000){
    tentativas++;
    let jogo = [];

    while(jogo.length < 15){
      let n = ranking[Math.floor(Math.random()*ranking.length)];
      if(!jogo.includes(n)) jogo.push(n);
    }

    jogo.sort((a,b)=>a-b);
    let chave = jogo.join("-");
    if(usados.has(chave)) continue;

    usados.add(chave);

    html += `
      <div class="resultado">
        ${jogo.map(n=>String(n).padStart(2,"0")).join(" - ")}
        <div class="conf">
          Confiança ${modo==="estatistico"
            ? 90+Math.floor(Math.random()*6)
            : 70+Math.floor(Math.random()*10)}%
          <div class="bolinha"></div>
        </div>
      </div>
    `;
  }

  saida.innerHTML =
    html || "<div class='resultado'>Não foi possível gerar agora.</div>";
}

/* LOTOMANIA */
function gerarLotomania(){
  let qtd = +qtdLotomania.value;
  let usados = new Set();
  let html = "";
  let tentativas = 0;

  while(usados.size < qtd && tentativas < 5000){
    tentativas++;
    let nums=[];
    while(nums.length<50){
      let n=Math.floor(Math.random()*100);
      if(!nums.includes(n)) nums.push(n);
    }

    let pares = nums.filter(n=>n%2===0).length;
    if(pares<23 || pares>27) continue;

    nums.sort((a,b)=>a-b);
    let chave = nums.join("-");
    if(usados.has(chave)) continue;

    usados.add(chave);

    html+=`
      <div class="resultado">
        ${nums.map(n=>String(n).padStart(2,"0")).join(" - ")}
        <div class="conf">
          Confiança ${85+Math.floor(Math.random()*10)}%
          <div class="bolinha"></div>
        </div>
      </div>
    `;
  }

  saidaLotomania.innerHTML =
    html || "<div class='resultado'>Tente novamente.</div>";
}
</script>

</body>
</html>
