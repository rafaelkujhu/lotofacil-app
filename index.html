<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loterias Inteligentes PRO</title>

<style>
:root{
  --roxo:#6a1b9a;
  --roxo2:#8e24aa;
  --claro:#f3e5f5;
  --verde:#2e7d32;
  --sucesso:#4caf50;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:#f0f2f5;
}
.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  border-radius:20px 20px 0 0;
  box-shadow: 0 0 20px rgba(0,0,0,0.1);
}
header{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  padding:20px;
  text-align:center;
  font-size:20px;
  font-weight:700;
  border-radius:0 0 20px 20px;
}
.tabs{display:flex;background:#eee;margin-top:10px;}
.tab{
  flex:1;padding:12px;text-align:center;font-weight:600;cursor:pointer;font-size:13px;color:#666;
}
.tab.active{
  background:#fff;color:var(--roxo);
  border-bottom:3px solid var(--roxo);
}
.content{padding:16px;}
.card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
  border: 1px solid #eee;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}
textarea,input,button,select{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid #ddd;
  font-size:14px;
  box-sizing: border-box;
}
button{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  font-weight:600;
  border:none;
  cursor:pointer;
  transition: transform 0.1s;
}
button:active{ transform: scale(0.98); }
.btn-copy{
    background: var(--verde);
    margin-top: 10px;
    font-size: 12px;
    padding: 8px;
}
.radio-group{
  display:flex;
  gap:10px;
  margin-top:10px;
  font-size:13px;
  flex-wrap:wrap;
}
/* Estilo das Dezenas (Bolinhas) */
.dezenas-container {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin: 10px 0;
}
.dezena {
    background: var(--roxo);
    color: white;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-weight: bold;
    font-size: 14px;
    box-shadow: inset -2px -2px 4px rgba(0,0,0,0.2);
}
.conf {
  margin-top:6px;
  font-size:12px;
  color:var(--verde);
  font-weight: 600;
}
.stats {
  font-size:12px;
  background: #f9f9f9;
  padding: 8px;
  border-radius: 8px;
  margin-top: 5px;
}
.footer{text-align:center;font-size:11px;color:#999;padding:20px;}
</style>
</head>

<body>

<div class="app">
<header>🎯 Loterias Inteligentes PRO</header>

<div class="tabs">
  <div class="tab active" onclick="trocarTab(0)">Lotofácil</div>
  <div class="tab" onclick="trocarTab(1)">Avançado</div>
  <div class="tab" onclick="trocarTab(3)">📘 Fechamentos</div>
</div>

<div class="content" id="tab0">
  <div class="card">
    <small>1. Analisar tendências reais:</small>
    <button onclick="buscarConcursos()" id="btnBusca">🔍 Sincronizar com a CAIXA</button>

    <div class="radio-group">
      <span>Analisar últimos:</span>
      <label><input type="radio" name="qtd" value="5" checked>5</label>
      <label><input type="radio" name="qtd" value="10">10</label>
      <label><input type="radio" name="qtd" value="20">20</label>
    </div>
    <textarea id="resultados" rows="3" placeholder="Os números dos concursos aparecerão aqui..." style="display:none"></textarea>
    <div id="estatisticaConcursos" style="display:none"></div>
  </div>

  <div class="card">
    <small>2. Configurar Gerador:</small>
    <div class="radio-group">
      <label><input type="radio" name="modo" value="estatistico" checked>🤖 Filtros Inteligentes</label>
      <label><input type="radio" name="modo" value="livre">🎲 Aleatório</label>
    </div>

    <div class="radio-group">
      <span>Dezenas por jogo:</span>
      <label><input type="radio" name="dezenas" value="15" checked>15</label>
      <label><input type="radio" name="dezenas" value="16">16</label>
    </div>

    <input type="number" id="qtdJogos" value="3" min="1" max="20" placeholder="Qtd de jogos">
    <button onclick="gerarSimples()" style="background: #28a745;">🔥 Gerar Jogos Otimizados</button>
  </div>

  <div id="saida"></div>

  <div class="card" id="cardPremio" style="display:none">
    <strong>💰 Estimativa de Prêmio</strong>
    <div id="premio" style="color:var(--roxo); font-size:18px; font-weight:bold;">—</div>
  </div>
</div>

<div class="footer">Otimizado para tendências matemáticas da Lotofácil</div>
</div>

<script>
// Lista de números primos na Lotofácil (0 a 25)
const PRIMOS = [2, 3, 5, 7, 11, 13, 17, 19, 23];

function trocarTab(i){
  document.querySelectorAll(".tab").forEach((t,idx)=>{
    t.classList.toggle("active",idx===i);
    const el = document.getElementById("tab"+idx);
    if(el) el.style.display = idx===i?"block":"none";
  });
}

function confianca(extra=0){
  return Math.min(99, 88 + extra + Math.floor(Math.random()*7));
}

async function buscarConcursos(){
  const btn = document.getElementById('btnBusca');
  btn.innerText = "⏳ Acessando API...";
  try{
    const r = await fetch("https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil");
    const d = await r.json();
    const ult = d.numero;
    const qtd = +document.querySelector('input[name="qtd"]:checked').value;

    let lista=[];
    for(let i=ult; i > ult-qtd; i--){
      let rr = await fetch(`https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil/${i}`);
      let dd = await rr.json();
      lista.push(dd.listaDezenas.join(" "));
    }

    resultados.value = lista.join("\n");
    gerarEstatisticaConcursos(lista);

    document.getElementById('cardPremio').style.display = "block";
    premio.innerText = d.acumulado
      ? `R$ ${d.valorEstimadoProximoConcurso.toLocaleString("pt-BR")}`
      : `Último prêmio: R$ ${d.valorPremio.toLocaleString("pt-BR")}`;
    
    btn.innerText = "✅ Sincronizado!";
    setTimeout(()=> btn.innerText = "🔍 Sincronizar com a CAIXA", 3000);

  }catch(e){
    btn.innerText = "❌ Erro ao buscar dados";
    console.warn("API Offline");
  }
}

function gerarEstatisticaConcursos(lista){
  let dezenas = lista.join(" ").split(" ").map(Number);
  let pares = dezenas.filter(n=>n%2===0).length;
  let total = dezenas.length;
  
  estatisticaConcursos.style.display="block";
  estatisticaConcursos.innerHTML=`
    <div class="stats">
        <strong>📊 Tendência dos últimos concursos:</strong><br>
        Média Par/Ímpar: ${Math.round((pares/lista.length))} / ${Math.round(((total-pares)/lista.length))}<br>
        Frequência de Primos: ${Math.round(dezenas.filter(n=>PRIMOS.includes(n)).length/lista.length)} por sorteio.
    </div>
  `;
}

function gerarSimples(){
  const dezenasQtd = +document.querySelector('input[name="dezenas"]:checked').value;
  const qtdJogos = +document.getElementById('qtdJogos').value;
  const modo = document.querySelector('input[name="modo"]:checked').value;
  
  let html="";
  for(let i=0; i<qtdJogos; i++){
    let jogo = [];
    
    // Lógica de Filtros (Pares 7-8 e Primos 5-6)
    let tentativa = 0;
    while(jogo.length < dezenasQtd){
        let n = Math.floor(Math.random() * 25) + 1;
        if(!jogo.includes(n)) {
            if(modo === "estatistico" && tentativa < 500){
                const pares = jogo.filter(x => x % 2 === 0).length;
                const primos = jogo.filter(x => PRIMOS.includes(x)).length;
                
                // Só adiciona se mantiver equilíbrio (aprox 7-8 pares e 5-6 primos)
                if(n % 2 === 0 && pares >= 9) { tentativa++; continue; }
                if(PRIMOS.includes(n) && primos >= 7) { tentativa++; continue; }
            }
            jogo.push(n);
        }
    }
    
    jogo.sort((a,b)=>a-b);
    
    html += `
      <div class="card">
        <div class="dezenas-container">
            ${jogo.map(n => `<div class="dezena">${n.toString().padStart(2,'0')}</div>`).join('')}
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="conf">✨ Probabilidade ${confianca()}%</div>
            <button class="btn-copy" onclick="copiarJogo('${jogo.join(' ')}')">📋 Copiar</button>
        </div>
      </div>`;
  }
  document.getElementById('saida').innerHTML = html;
}

function copiarJogo(texto) {
    navigator.clipboard.writeText(texto);
    alert("Jogo copiado para a área de transferência!");
}
</script>

</body>
</html>
