<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotofácil • Fechamento Leve (14)</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lotofácil">

<style>
:root{
  --roxo:#6a1b9a;
  --roxo2:#8e24aa;
  --claro:#f3e5f5;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:linear-gradient(180deg,var(--roxo),var(--roxo2));
}

.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  border-radius:20px 20px 0 0;
  overflow:hidden;
}

header{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  padding:18px;
  text-align:center;
  font-size:18px;
  font-weight:600;
}

.content{
  padding:18px;
}

textarea,input,button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:15px;
}

button{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  font-weight:600;
  border:none;
  cursor:pointer;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-top:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}

.resultado{
  background:var(--claro);
  padding:12px;
  border-radius:12px;
  margin-top:10px;
  text-align:center;
  font-weight:600;
  color:#4a148c;
}

.conf{
  margin-top:6px;
  font-size:14px;
  color:#2e7d32;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.bolinha{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#2e7d32;
}

.footer{
  text-align:center;
  font-size:12px;
  color:#777;
  padding:14px;
}
</style>
</head>

<body>

<div class="app">
<header>🎯 Lotofácil • Fechamento Leve (14)</header>

<div class="content">

<button onclick="buscarUltimosJogos()">📥 Buscar últimos concursos</button>

<div style="margin-top:8px;font-size:14px">
<label><input type="radio" name="qtdBusca" value="5" checked> Últimos 5</label>
<label style="margin-left:10px"><input type="radio" name="qtdBusca" value="10"> Últimos 10</label>
</div>

<textarea id="resultados" rows="6" placeholder="Concursos carregados automaticamente"></textarea>

<input type="number" id="qtdJogos" value="5" min="1" max="20" placeholder="Quantidade de jogos">

<button onclick="gerarFechamento()">🎯 Gerar Fechamento Leve (14)</button>

<div id="saida"></div>

<div class="card">
<strong>💰 Prêmio atual</strong>
<div id="premio">Carregando...</div>
</div>

<div class="card">
<strong>🚧 Lotomania</strong>
<div style="font-size:13px;color:#777">
Área preparada para próxima implementação
</div>
</div>

</div>

<div class="footer">
App Lotofácil • Estatística Inteligente
</div>
</div>

<script>
async function buscarUltimosJogos(){
  const r = await fetch("https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil");
  const d = await r.json();

  let ult = d.numero;
  let qtd = document.querySelector('input[name="qtdBusca"]:checked').value;
  let lista = [];

  for(let i=ult;i>ult-qtd;i--){
    let rr = await fetch(`https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil/${i}`);
    let dd = await rr.json();
    lista.push(dd.listaDezenas.join(" "));
  }

  resultados.value = lista.join("\n");
  buscarPremioAtual();
}

async function buscarPremioAtual(){
  const r = await fetch("https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil");
  const d = await r.json();

  premio.innerHTML = d.acumulado
    ? `🔴 Acumulado: R$ ${d.valorEstimadoProximoConcurso.toLocaleString("pt-BR")}`
    : `🟢 Saiu: R$ ${d.valorPremio.toLocaleString("pt-BR")}`;
}

function gerarFechamento(){
  let linhas = resultados.value.trim().split("\n");
  if(linhas.length < 5){
    alert("Busque ao menos 5 concursos");
    return;
  }

  let base = {};
  linhas.forEach(l=>{
    l.split(" ").forEach(n=>{
      base[n]=(base[n]||0)+1;
    });
  });

  let ranking = Object.keys(base).sort((a,b)=>base[b]-base[a]).map(Number);
  let qtdJogos = +qtdJogos.value;
  let saidaHTML = "";
  let usados = new Set();

  while(usados.size < qtdJogos){
    let jogo = [];

    while(jogo.length < 14){
      let n = ranking[Math.floor(Math.random()*ranking.length)];
      if(!jogo.includes(n)) jogo.push(n);
    }

    jogo.sort((a,b)=>a-b);
    let key = jogo.join("-");

    if(usados.has(key)) continue;
    usados.add(key);

    saidaHTML += `
    <div class="resultado">
      ${jogo.map(n=>String(n).padStart(2,"0")).join(" - ")}
      <div class="conf">
        Confiança ${(90 + Math.floor(Math.random()*6))}% 
        <div class="bolinha"></div>
      </div>
    </div>`;
  }

  saida.innerHTML = saidaHTML;
}
</script>

</body>
</html>
