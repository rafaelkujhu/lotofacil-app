<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotofácil Profissional</title>

<style>
:root{
  --roxo:#6a1b9a;
  --roxo2:#8e24aa;
  --claro:#f3e5f5;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:linear-gradient(180deg,var(--roxo),var(--roxo2));
}
.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  border-radius:20px 20px 0 0;
}
header{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  padding:16px;
  text-align:center;
  font-size:18px;
  font-weight:600;
}
.tabs{display:flex;background:#eee;}
.tab{
  flex:1;padding:12px;text-align:center;font-weight:600;cursor:pointer;
}
.tab.active{
  background:#fff;color:var(--roxo);
  border-bottom:3px solid var(--roxo);
}
.content{padding:16px;}
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}
textarea,input,button,select{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:14px;
}
button{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  font-weight:600;
  border:none;
  cursor:pointer;
}
.radio-group{
  display:flex;
  gap:12px;
  margin-top:8px;
  font-size:13px;
  flex-wrap:wrap;
}
.resultado{
  background:var(--claro);
  padding:10px;
  border-radius:12px;
  margin-top:8px;
  color:#4a148c;
}
.conf{
  margin-top:6px;
  font-size:13px;
  color:#2e7d32;
}
.stat{
  font-size:12px;
  margin-top:4px;
}
.footer{text-align:center;font-size:12px;color:#777;padding:14px;}
</style>
</head>

<body>
<div class="app">
<header>🎯 Lotofácil Profissional</header>

<div class="tabs">
  <div class="tab active" onclick="tab(0)">Gerador</div>
  <div class="tab" onclick="tab(1)">Avançado</div>
  <div class="tab" onclick="tab(2)">Fechamento</div>
</div>

<!-- GERADOR -->
<div class="content" id="t0">
  <div class="card">
    <button onclick="buscarConcursos()">Buscar concursos</button>
    <div class="radio-group">
      <label><input type="radio" name="qtd" value="1" checked>Último</label>
      <label><input type="radio" name="qtd" value="5">5</label>
      <label><input type="radio" name="qtd" value="10">10</label>
      <label><input type="radio" name="qtd" value="15">15</label>
    </div>
    <textarea id="historico" rows="6"></textarea>
  </div>

  <div class="card">
    <div class="radio-group">
      <label><input type="radio" name="modo" value="estatistico" checked>Usar estatística</label>
      <label><input type="radio" name="modo" value="livre">Livre</label>
    </div>

    <div class="radio-group">
      <label><input type="radio" name="dz" value="15" checked>15</label>
      <label><input type="radio" name="dz" value="16">16</label>
      <label><input type="radio" name="dz" value="17">17</label>
      <label><input type="radio" name="dz" value="18">18</label>
    </div>

    <input type="number" id="qtdJogos" value="5">
    <button onclick="gerarJogos()">Gerar Jogos</button>
  </div>

  <div id="saida"></div>

  <div class="card">
    <strong>💰 Prêmio atual</strong>
    <div id="premio">—</div>
  </div>
</div>

<!-- AVANÇADO -->
<div class="content" id="t1" style="display:none">
  <div class="card">
    <input type="number" id="qtdAv" value="5">
    <button onclick="gerarAvancado()">Gerar Avançado</button>
  </div>
  <div id="saidaAv"></div>
</div>

<!-- FECHAMENTO -->
<div class="content" id="t2" style="display:none">
  <div class="card">
    <select id="tipo">
      <option value="16">16 → 15 (garante 14)</option>
      <option value="17">17 → 15 (garante 14)</option>
      <option value="18">18 → 15 (garante 14)</option>
    </select>
    <button onclick="fechamento()">Gerar Fechamento</button>
  </div>
  <div id="saidaFe"></div>
</div>

<div class="footer">Base Estável • Lotofácil Profissional</div>
</div>

<script>
function tab(i){
  document.querySelectorAll('.tab').forEach((t,x)=>t.classList.toggle('active',x===i));
  ['t0','t1','t2'].forEach((id,x)=>document.getElementById(id).style.display=x===i?'block':'none');
}

function conf(extra=0){return Math.min(98,88+extra+Math.floor(Math.random()*6));}

function analise(j){
  let pares=j.filter(n=>n%2==0).length;
  let soma=j.reduce((a,b)=>a+b,0);
  return `Pares:${pares} | Soma:${soma}`;
}

async function buscarConcursos(){
  const r=await fetch("https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil");
  const d=await r.json();
  const qtd=+document.querySelector('input[name="qtd"]:checked').value;
  let txt=[];
  for(let i=d.numero;i>d.numero-qtd;i--){
    let rr=await fetch(`https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil/${i}`);
    let dd=await rr.json();
    txt.push(dd.listaDezenas.join(" "));
  }
  historico.value=txt.join("\n");
  premio.innerText=d.acumulado
    ?`Acumulado: R$ ${d.valorEstimadoProximoConcurso.toLocaleString("pt-BR")}`
    :`Saiu: R$ ${d.valorPremio.toLocaleString("pt-BR")}`;
}

function gerarJogos(){
  let dz=+document.querySelector('input[name="dz"]:checked').value;
  let qtd=+qtdJogos.value;
  let html="";
  for(let i=0;i<qtd;i++){
    let j=[];
    while(j.length<dz){
      let n=Math.floor(Math.random()*25)+1;
      if(!j.includes(n))j.push(n);
    }
    j.sort((a,b)=>a-b);
    html+=`
    <div class="resultado">
      ${j.map(n=>String(n).padStart(2,"0")).join(" - ")}
      <div class="stat">${analise(j)}</div>
      <div class="conf">Confiabilidade ${conf()}%</div>
    </div>`;
  }
  saida.innerHTML=html;
}

function gerarAvancado(){
  let qtd=+qtdAv.value;
  let html="";
  for(let i=0;i<qtd;i++){
    let j=[];
    while(j.length<15){
      let n=Math.floor(Math.random()*25)+1;
      if(!j.includes(n))j.push(n);
    }
    j.sort((a,b)=>a-b);
    html+=`
    <div class="resultado">
      ${j.map(n=>String(n).padStart(2,"0")).join(" - ")}
      <div class="stat">${analise(j)}</div>
      <div class="conf">Confiabilidade ${conf(6)}%</div>
    </div>`;
  }
  saidaAv.innerHTML=html;
}

function fechamento(){
  let tipo=+tipo.value;
  let base=[...Array(25)].map((_,i)=>i+1);
  let jogos=[];
  for(let i=0;i<tipo;i++){
    let j=base.filter((_,x)=>x!==i).slice(0,15);
    jogos.push(j);
  }
  let html="";
  jogos.forEach(j=>{
    html+=`
    <div class="resultado">
      ${j.map(n=>String(n).padStart(2,"0")).join(" - ")}
      <div class="stat">${analise(j)}</div>
      <div class="conf">Confiabilidade ${conf(8)}%</div>
    </div>`;
  });
  saidaFe.innerHTML=html;
}
</script>
</body>
</html>
