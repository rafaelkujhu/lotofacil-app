<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loterias Inteligentes PRO</title>

<style>
:root{
  --roxo:#6a1b9a;
  --roxo2:#8e24aa;
  --claro:#f3e5f5;
  --verde:#2e7d32;
  --amarelo:#fbc02d;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:#f4f4f9;
}
.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  border-radius:20px 20px 0 0;
}
header{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  padding:18px;
  text-align:center;
  font-size:20px;
  font-weight:700;
}
.tabs{display:flex;background:#eee;border-bottom:2px solid #ddd;}
.tab{flex:1;padding:12px;text-align:center;font-weight:600;cursor:pointer;font-size:12px;}
.tab.active{background:#fff;color:var(--roxo);border-bottom:3px solid var(--roxo);}

.content{padding:16px;}
.card{
  background:#fff;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
  border: 1px solid #eee;
  box-shadow:0 4px 10px rgba(0,0,0,.05);
}

/* Gráfico de Faixas */
.faixa-row {
  margin-top: 10px;
}
.faixa-label {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  margin-bottom: 4px;
  font-weight: 600;
}
.barra-bg {
  background: #eee;
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
}
.barra-fill {
  background: var(--roxo);
  height: 100%;
  transition: width 0.5s;
}

button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:10px;
  border:none;
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  font-weight:600;
  cursor:pointer;
}
.btn-small { background: #444; font-size: 12px; padding: 8px; }

.status-txt {
  font-size: 11px;
  color: #888;
  text-align: center;
  margin-top: 6px;
}

.dezena-box {
  display: inline-block;
  width: 28px;
  height: 28px;
  line-height: 28px;
  text-align: center;
  background: var(--roxo);
  color: #fff;
  border-radius: 50%;
  margin: 3px;
  font-size: 12px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="app">
  <header>🎯 Loterias Inteligentes PRO</header>

  <div class="tabs">
    <div class="tab active" onclick="trocarTab(0)">Análise</div>
    <div class="tab" onclick="trocarTab(1)">Gerador</div>
  </div>

  <div class="content" id="tab0">
    <div class="card">
      <strong>📡 Sincronização</strong>
      <button class="btn-small" onclick="buscarDados(1)">Último Concurso</button>
      <button onclick="buscarDados()">Analisar Histórico</button>
      <div id="status" class="status-txt">Aguardando comando...</div>
    </div>

    <div id="painelAnalise" style="display:none">
      <div class="card">
        <strong>📊 Estatísticas das Faixas (Média)</strong>
        
        <div class="faixa-row">
          <div class="faixa-label"><span>Faixa 01 - 10</span><span id="txtF1">0</span></div>
          <div class="barra-bg"><div id="barF1" class="barra-fill" style="width: 0%"></div></div>
        </div>

        <div class="faixa-row">
          <div class="faixa-label"><span>Faixa 11 - 20</span><span id="txtF2">0</span></div>
          <div class="barra-bg"><div id="barF2" class="barra-fill" style="width: 0%"></div></div>
        </div>

        <div class="faixa-row">
          <div class="faixa-label"><span>Faixa 21 - 25</span><span id="txtF3">0</span></div>
          <div class="barra-bg"><div id="barF3" class="barra-fill" style="width: 0%"></div></div>
        </div>
      </div>

      <div class="card">
        <strong>⚖️ Equilíbrio & Soma</strong>
        <div style="font-size: 13px; margin-top:8px;">
          Média Pares: <b id="avgPares">0</b><br>
          Soma Média: <b id="avgSoma">0</b><br>
          Repetidos do anterior: <b id="avgRepetidos">0</b>
        </div>
      </div>
    </div>

    <div id="listaResultados"></div>
  </div>

  <div class="content" id="tab1" style="display:none">
      <div class="card">
          <strong>🎲 Gerador Simples</strong>
          <button onclick="gerarJogos()">Gerar 3 Jogos</button>
      </div>
      <div id="saidaJogos"></div>
  </div>
</div>

<script>
let historico = [];

function trocarTab(i){
  document.querySelectorAll(".tab").forEach((t,idx)=>{
    t.classList.toggle("active",idx===i);
    document.getElementById("tab"+idx).style.display = idx===i?"block":"none";
  });
}

async function buscarDados(qtdManual = 10) {
  const statusEl = document.getElementById('status');
  statusEl.innerText = "Buscando dados oficiais...";
  
  try {
    const r = await fetch("https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil");
    const d = await r.json();
    const ultimo = d.numero;
    
    historico = [];
    // Busca os últimos concursos (máximo 10 para evitar lentidão)
    for(let i=ultimo; i > ultimo - qtdManual; i--) {
      try {
        const resp = await fetch(`https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil/${i}`);
        const data = await resp.json();
        historico.push(data);
      } catch(e) {}
    }

    renderizarAnalise();
    statusEl.innerText = `Sucesso! ${historico.length} concursos analisados.`;
  } catch(e) {
    statusEl.innerText = "API indisponível no momento.";
  }
}

function renderizarAnalise() {
  if(historico.length === 0) return;
  document.getElementById('painelAnalise').style.display = 'block';

  let f1=0, f2=0, f3=0, pares=0, soma=0, repetidos=0;

  historico.forEach((c, idx) => {
    let dezenas = c.listaDezenas.map(Number);
    
    // Contagem por faixas
    dezenas.forEach(n => {
      if(n <= 10) f1++;
      else if(n <= 20) f2++;
      else f3++;
      if(n % 2 === 0) pares++;
      soma += n;
    });

    // Repetidos (comparando com o próximo concurso da lista, que é o anterior cronologicamente)
    if(historico[idx+1]) {
        let ant = historico[idx+1].listaDezenas.map(Number);
        repetidos += dezenas.filter(n => ant.includes(n)).length;
    }
  });

  const total = historico.length;
  const mF1 = (f1/total).toFixed(1);
  const mF2 = (f2/total).toFixed(1);
  const mF3 = (f3/total).toFixed(1);

  // Atualiza Interface
  document.getElementById('txtF1').innerText = mF1 + " dezenas";
  document.getElementById('txtF2').innerText = mF2 + " dezenas";
  document.getElementById('txtF3').innerText = mF3 + " dezenas";
  
  // Barras (Baseado no máximo de 10 dezenas por faixa)
  document.getElementById('barF1').style.width = (mF1 * 10) + "%";
  document.getElementById('barF2').style.width = (mF2 * 10) + "%";
  document.getElementById('barF3').style.width = (mF3 * 20) + "%"; // Faixa 3 é menor (5 números), então o peso visual é maior

  document.getElementById('avgPares').innerText = (pares/total).toFixed(1);
  document.getElementById('avgSoma').innerText = (soma/total).toFixed(0);
  document.getElementById('avgRepetidos').innerText = (repetidos/(total-1)).toFixed(1);

  // Lista simples de resultados
  const lista = document.getElementById('listaResultados');
  lista.innerHTML = "<strong>Resultados Analisados:</strong>";
  historico.forEach(c => {
    lista.innerHTML += `<div class="card" style="font-size:12px">
      <b>Concurso ${c.numero}</b><br>
      ${c.listaDezenas.map(n => `<span class="dezena-box">${n}</span>`).join('')}
    </div>`;
  });
}

function gerarJogos() {
    const saida = document.getElementById('saidaJogos');
    saida.innerHTML = "";
    for(let i=0; i<3; i++) {
        let jogo = [];
        while(jogo.length < 15) {
            let n = Math.floor(Math.random() * 25) + 1;
            if(!jogo.includes(n)) jogo.push(n);
        }
        jogo.sort((a,b) => a-b);
        saida.innerHTML += `<div class="card">${jogo.map(n => `<span class="dezena-box" style="background:var(--verde)">${n.toString().padStart(2,'0')}</span>`).join('')}</div>`;
    }
}
</script>

</body>
</html>
