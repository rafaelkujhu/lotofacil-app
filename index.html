<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loterias Inteligentes PRO</title>

<style>
:root{
  --roxo:#6a1b9a;
  --roxo2:#8e24aa;
  --claro:#f3e5f5;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:linear-gradient(180deg,var(--roxo),var(--roxo2));
}
.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  border-radius:20px 20px 0 0;
}
header{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  padding:16px;
  text-align:center;
  font-size:18px;
  font-weight:600;
}
.tabs{display:flex;background:#eee;}
.tab{
  flex:1;padding:12px;text-align:center;font-weight:600;cursor:pointer;
}
.tab.active{
  background:#fff;color:var(--roxo);
  border-bottom:3px solid var(--roxo);
}
.content{padding:16px;}
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}
textarea,input,button,select{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:14px;
}
button{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  font-weight:600;
  border:none;
  cursor:pointer;
}
.radio-group{
  display:flex;
  gap:12px;
  margin-top:8px;
  font-size:13px;
  flex-wrap:wrap;
}
.resultado{
  background:var(--claro);
  padding:10px;
  border-radius:12px;
  margin-top:8px;
  text-align:center;
  font-weight:600;
  color:#4a148c;
}
.footer{text-align:center;font-size:12px;color:#777;padding:14px;}
</style>
</head>

<body>

<div class="app">
<header>🎯 Loterias Inteligentes PRO</header>

<div class="tabs">
  <div class="tab active" onclick="trocarTab(0)">Simples</div>
  <div class="tab" onclick="trocarTab(1)">Avançado</div>
</div>

<!-- ================= MODO SIMPLES ================= -->
<div class="content" id="tab0">

  <div class="card">
    <button onclick="buscarUltimos()">Buscar concursos</button>

    <div class="radio-group">
      <label><input type="radio" name="qtd" value="5" checked>5</label>
      <label><input type="radio" name="qtd" value="10">10</label>
      <label><input type="radio" name="qtd" value="15">15</label>
    </div>

    <textarea id="resultados" rows="5"></textarea>

    <div class="radio-group">
      <label><input type="radio" name="modo" value="estatistico" checked>Estatístico</label>
      <label><input type="radio" name="modo" value="livre">Livre</label>
    </div>

    <div class="radio-group">
      <label><input type="radio" name="qtdezenas" value="15" checked>15</label>
      <label><input type="radio" name="qtdezenas" value="16">16</label>
      <label><input type="radio" name="qtdezenas" value="17">17</label>
      <label><input type="radio" name="qtdezenas" value="18">18</label>
    </div>

    <input type="number" id="qtdJogos" value="5" min="1" max="20">
    <button onclick="gerarSimples()">Gerar Jogos</button>
  </div>

  <div id="saida"></div>
</div>

<!-- ================= MODO AVANÇADO ================= -->
<div class="content" id="tab1" style="display:none">

  <div class="card">
    <strong>🔐 Fechamento Matemático</strong>

    <select id="tipoFechamento">
      <option value="16">16 → 15 (garante 14)</option>
      <option value="17">17 → 15 (garante 14)</option>
      <option value="18">18 → 15 (garante 14)</option>
    </select>

    <button onclick="gerarFechamentoMatematico()">Gerar Fechamento</button>
  </div>

  <div id="saidaAvancado"></div>
</div>

<div class="footer">App PRO • Fechamento Matemático Real</div>
</div>

<script>
function trocarTab(i){
  document.querySelectorAll(".tab").forEach((t,idx)=>{
    t.classList.toggle("active",idx===i);
    document.getElementById("tab"+idx).style.display = idx===i?"block":"none";
  });
}

/* ===== BUSCAR CONCURSOS ===== */
async function buscarUltimos(){
  const r = await fetch("https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil");
  const d = await r.json();
  const ult = d.numero;
  const qtd = +document.querySelector('input[name="qtd"]:checked').value;

  let lista=[];
  for(let i=ult;i>ult-qtd;i--){
    let rr = await fetch(`https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil/${i}`);
    let dd = await rr.json();
    lista.push(dd.listaDezenas.join(" "));
  }
  resultados.value = lista.join("\n");
}

/* ===== MODO SIMPLES (ESTÁVEL) ===== */
function gerarSimples(){
  let modo = document.querySelector('input[name="modo"]:checked').value;
  let dezenas = +document.querySelector('input[name="qtdezenas"]:checked').value;
  let qtd = +qtdJogos.value;

  let ranking = [];

  if(modo==="estatistico"){
    let base={};
    resultados.value.trim().split("\n").forEach(l=>{
      l.split(" ").forEach(n=>base[n]=(base[n]||0)+1);
    });
    ranking = Object.keys(base).map(Number);
  }

  while(ranking.length < dezenas){
    let n = Math.floor(Math.random()*25)+1;
    if(!ranking.includes(n)) ranking.push(n);
  }

  let html="";
  for(let i=0;i<qtd;i++){
    let j=[];
    while(j.length<dezenas){
      let n = ranking[Math.floor(Math.random()*ranking.length)];
      if(!j.includes(n)) j.push(n);
    }
    j.sort((a,b)=>a-b);
    html+=`<div class="resultado">${j.map(n=>String(n).padStart(2,"0")).join(" - ")}</div>`;
  }
  saida.innerHTML = html;
}

/* ===== FECHAMENTO MATEMÁTICO REAL ===== */
function gerarFechamentoMatematico(){
  let tipo = +document.getElementById("tipoFechamento").value;

  let base = Array.from({length:25},(_,i)=>i+1).slice(0,tipo);

  let removals=[];
  if(tipo===16){
    removals = [...Array(16).keys()].map(i=>[i]);
  } else if(tipo===17){
    for(let i=0;i<17;i++) removals.push([i,(i+1)%17]);
  } else {
    for(let i=0;i<18;i++) removals.push([i,(i+1)%18,(i+2)%18]);
  }

  let html=`<div class="resultado">Jogos: ${removals.length}</div>`;
  removals.forEach(r=>{
    let jogo = base.filter((_,idx)=>!r.includes(idx));
    html+=`<div class="resultado">${jogo.map(n=>String(n).padStart(2,"0")).join(" - ")}</div>`;
  });

  saidaAvancado.innerHTML = html;
}
</script>

</body>
</html>
