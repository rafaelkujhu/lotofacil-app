<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotofácil Profissional</title>

<style>
:root{
  --roxo:#6a1b9a;
  --roxo2:#8e24aa;
  --claro:#f3e5f5;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:linear-gradient(180deg,var(--roxo),var(--roxo2));
}
.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  border-radius:20px 20px 0 0;
}
header{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  padding:16px;
  text-align:center;
  font-size:18px;
  font-weight:600;
}
.tabs{display:flex;background:#eee;}
.tab{
  flex:1;padding:12px;text-align:center;font-weight:600;cursor:pointer;
}
.tab.active{
  background:#fff;color:var(--roxo);
  border-bottom:3px solid var(--roxo);
}
.content{padding:16px;}
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}
textarea,input,button,select{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:14px;
}
button{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  font-weight:600;
  border:none;
  cursor:pointer;
}
.radio-group{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  font-size:13px;
}
.resultado{
  background:var(--claro);
  padding:12px;
  border-radius:12px;
  margin-top:10px;
}
.stat{font-size:12px;margin-top:4px}
.conf{font-size:13px;color:#2e7d32;margin-top:4px}
.ok{color:#2e7d32;font-weight:600}
.bad{color:#c62828;font-weight:600}
.footer{text-align:center;font-size:12px;color:#777;padding:14px;}
.historico-card{
  background:#f7f7fb;
  border-radius:12px;
  padding:10px;
  margin-top:10px;
  font-size:13px;
}
.historico-numeros{
  font-weight:600;
  color:#4a148c;
}
</style>
</head>

<body>
<div class="app">
<header>🎯 Lotofácil Profissional</header>

<div class="tabs">
  <div class="tab active" onclick="tab(0)">Gerador</div>
  <div class="tab" onclick="tab(1)">Avançado</div>
  <div class="tab" onclick="tab(2)">Fechamento</div>
</div>

<!-- GERADOR -->
<div class="content" id="t0">

<div class="card">
<button onclick="buscarConcursos()">Buscar concursos</button>
<div class="radio-group">
<label><input type="radio" name="qtd" value="1" checked>Último</label>
<label><input type="radio" name="qtd" value="5">5</label>
<label><input type="radio" name="qtd" value="10">10</label>
<label><input type="radio" name="qtd" value="15">15</label>
</div>
<textarea id="historico" rows="6" placeholder="Concursos carregados"></textarea>
</div>

<!-- 🔥 NOVO: Estatísticas dos concursos -->
<div class="card">
<strong>📊 Estatísticas dos concursos carregados</strong>
<div id="painelHistorico"></div>
</div>

<div class="card">
<div class="radio-group">
<label><input type="radio" name="dz" value="15" checked>15</label>
<label><input type="radio" name="dz" value="16">16</label>
<label><input type="radio" name="dz" value="17">17</label>
<label><input type="radio" name="dz" value="18">18</label>
</div>

<input type="number" id="qtdJogos" value="5">
<button onclick="gerarGerador()">Gerar Jogos</button>
</div>

<div id="saida"></div>

<div class="card">
<strong>💰 Prêmio atual</strong>
<div id="premio">—</div>
</div>

</div>

<!-- AVANÇADO -->
<div class="content" id="t1" style="display:none">
<div class="card">
<label>Base</label>
<select id="baseAv">
<option>16</option><option>17</option><option>18</option>
<option>19</option><option>20</option><option>21</option>
<option>22</option><option>23</option><option>24</option><option>25</option>
</select>

<label>Jogo</label>
<select id="jogoAv">
<option>15</option><option>16</option><option>17</option><option>18</option>
</select>

<input type="number" id="qtdAv" value="5">
<button onclick="gerarAvancado()">Gerar Avançado</button>
</div>
<div id="saidaAv"></div>
</div>

<!-- FECHAMENTO -->
<div class="content" id="t2" style="display:none">
<div class="card">
<select id="tipoFe">
<option value="16">16 → 15 (garante 14)</option>
<option value="17">17 → 15 (garante 14)</option>
<option value="18">18 → 15 (garante 14)</option>
</select>
<button onclick="gerarFechamento()">Gerar Fechamento</button>
</div>
<div id="saidaFe"></div>
</div>

<div class="footer">Lotofácil Profissional • Base Estável</div>
</div>

<script>
let concursos=[];

function tab(i){
  document.querySelectorAll('.tab').forEach((t,x)=>t.classList.toggle('active',x===i));
  ['t0','t1','t2'].forEach((id,x)=>document.getElementById(id).style.display=x===i?'block':'none');
}

function confianca(p,s){
  let c=70;
  if(p>=7&&p<=9)c+=10;
  if(s>=180&&s<=230)c+=10;
  return Math.min(95,c+Math.floor(Math.random()*5));
}

function analisar(j,ref){
  let pares=j.filter(n=>n%2===0).length;
  let soma=j.reduce((a,b)=>a+b,0);
  let f=[0,0,0,0,0];
  j.forEach(n=>{
    if(n<=5)f[0]++; else if(n<=10)f[1]++;
    else if(n<=15)f[2]++; else if(n<=20)f[3]++; else f[4]++;
  });
  let rep=ref?j.filter(n=>ref.includes(n)).length:0;
  let ok=(pares>=7&&pares<=9&&soma>=180&&soma<=230);
  return {pares,soma,f,rep,ok};
}

async function buscarConcursos(){
  const r=await fetch("https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil");
  const d=await r.json();
  const qtd=+document.querySelector('input[name="qtd"]:checked').value;
  concursos=[];
  for(let i=d.numero;i>d.numero-qtd;i--){
    let rr=await fetch(`https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil/${i}`);
    let dd=await rr.json();
    concursos.push(dd.listaDezenas.map(Number));
  }
  historico.value=concursos.map(c=>c.join(" ")).join("\n");

  premio.innerText=d.acumulado
    ?`Acumulado: R$ ${d.valorEstimadoProximoConcurso?.toLocaleString("pt-BR")}`
    :`Saiu: R$ ${d.valorPremio?.toLocaleString("pt-BR")}`;

  renderHistorico();
}

function renderHistorico(){
  let html="";
  concursos.forEach((c,i)=>{
    let ref=i<concursos.length-1?concursos[i+1]:null;
    let a=analisar(c,ref);
    html+=`
      <div class="historico-card">
        <div class="historico-numeros">🎯 ${c.join(" - ")}</div>
        🔢 Pares: ${a.pares} | Ímpares: ${15-a.pares}<br>
        ➕ Soma: ${a.soma}<br>
        📊 Faixas: ${a.f.join(" / ")}<br>
        🔁 Repetição: ${a.rep}
        <div class="${a.ok?'ok':'bad'}">${a.ok?'🟢 Dentro do padrão':'🔴 Fora do padrão'}</div>
      </div>`;
  });
  painelHistorico.innerHTML=html;
}

/* GERADOR / AVANÇADO / FECHAMENTO permanecem iguais */
</script>
</body>
</html>
