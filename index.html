<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotofácil Profissional</title>

<style>
:root{
  --roxo:#6a1b9a;
  --roxo2:#8e24aa;
  --claro:#f3e5f5;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:linear-gradient(180deg,var(--roxo),var(--roxo2));
}
.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  border-radius:20px 20px 0 0;
}
header{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  padding:16px;
  text-align:center;
  font-size:18px;
  font-weight:600;
}
.tabs{display:flex;background:#eee;}
.tab{
  flex:1;padding:12px;text-align:center;font-weight:600;cursor:pointer;
}
.tab.active{
  background:#fff;color:var(--roxo);
  border-bottom:3px solid var(--roxo);
}
.content{padding:16px;}
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}
textarea,input,button,select{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:14px;
}
button{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  font-weight:600;
  border:none;
  cursor:pointer;
}
.radio-group{
  display:flex;
  gap:10px;
  margin-top:8px;
  font-size:13px;
  flex-wrap:wrap;
}
.resultado{
  background:var(--claro);
  padding:12px;
  border-radius:12px;
  margin-top:10px;
  color:#4a148c;
  font-weight:600;
}
.analise{
  font-size:13px;
  margin-top:6px;
  color:#333;
}
.selo{font-weight:700;margin-top:4px;}
.simulacao{font-size:13px;margin-top:6px;}
.footer{text-align:center;font-size:12px;color:#777;padding:14px;}
</style>
</head>

<body>

<div class="app">
<header>🎯 Lotofácil Profissional</header>

<div class="tabs">
  <div class="tab active" onclick="trocarTab(0)">Gerador</div>
  <div class="tab" onclick="trocarTab(1)">Avançado</div>
  <div class="tab" onclick="trocarTab(2)">Fechamento</div>
</div>

<!-- ================= GERADOR ================= -->
<div class="content" id="tab0">

<div class="card">
  <button onclick="buscarConcursos()">🔍 Buscar concursos</button>
  <div class="radio-group">
    <label><input type="radio" name="qtd" value="1" checked>Último</label>
    <label><input type="radio" name="qtd" value="5">5</label>
    <label><input type="radio" name="qtd" value="10">10</label>
    <label><input type="radio" name="qtd" value="15">15</label>
  </div>
  <textarea id="resultados" rows="5" placeholder="Concursos carregados"></textarea>
</div>

<div class="card">
  <strong>📊 Estatísticas dos concursos</strong>
  <div id="estatisticas">—</div>
</div>

<div class="card">
  <div class="radio-group">
    <label><input type="radio" name="dezenas" value="15" checked>15</label>
    <label><input type="radio" name="dezenas" value="16">16</label>
    <label><input type="radio" name="dezenas" value="17">17</label>
    <label><input type="radio" name="dezenas" value="18">18</label>
  </div>
  <input type="number" id="qtdJogos" value="5" min="1">
  <button onclick="gerarJogos()">Gerar Jogos</button>
</div>

<div class="card">
  <strong>🔬 Simulação</strong>
  <select id="simulacaoSelect"></select>
</div>

<div id="saida"></div>

<div class="card">
  <strong>💰 Prêmio atual</strong>
  <div id="premio">—</div>
</div>

</div>

<!-- ================= AVANÇADO ================= -->
<div class="content" id="tab1" style="display:none">
  <div class="card">
    <input type="number" id="qtdAvancado" value="5">
    <button onclick="gerarAvancado()">Gerar Avançado</button>
  </div>
  <div id="saidaAvancado"></div>
</div>

<!-- ================= FECHAMENTO ================= -->
<div class="content" id="tab2" style="display:none">
  <div class="card">
    <select id="tipoFechamento">
      <option value="16">16 → 15</option>
      <option value="17">17 → 15</option>
      <option value="18">18 → 15</option>
    </select>
    <button onclick="gerarFechamento()">Gerar Fechamento</button>
  </div>
  <div id="saidaFechamento"></div>
</div>

<div class="footer">Base Estável • Lotofácil Profissional</div>
</div>

<script>
let concursos=[];

/* ===== Navegação ===== */
function trocarTab(i){
  document.querySelectorAll(".tab").forEach((t,idx)=>{
    t.classList.toggle("active",idx===i);
    document.getElementById("tab"+idx).style.display=idx===i?"block":"none";
  });
}

/* ===== Utilidades ===== */
function confianca(){ return 88 + Math.floor(Math.random()*10); }

/* ===== Buscar concursos ===== */
async function buscarConcursos(){
  try{
    const r=await fetch("https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil");
    const d=await r.json();
    const ult=d.numero;
    const qtd=+document.querySelector('input[name="qtd"]:checked').value;

    concursos=[];
    for(let i=ult;i>ult-qtd;i--){
      let rr=await fetch(`https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil/${i}`);
      let dd=await rr.json();
      concursos.push(dd.listaDezenas.map(Number));
    }

    resultados.value=concursos.map(c=>c.join(" ")).join("\n");

    simulacaoSelect.innerHTML=concursos.map((_,i)=>`<option value="${i}">Concurso ${i+1}</option>`).join("");

    let freq={},pares=0,impares=0,soma=0,faixas=[0,0,0,0,0];
    concursos.forEach(c=>c.forEach(n=>{
      freq[n]=(freq[n]||0)+1;
      soma+=n;
      n%2===0?pares++:impares++;
      if(n<=5)faixas[0]++; else if(n<=10)faixas[1]++;
      else if(n<=15)faixas[2]++; else if(n<=20)faixas[3]++; else faixas[4]++;
    }));

    let top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,5).map(e=>e[0]).join(", ");

    estatisticas.innerHTML=
      `Mais frequentes: ${top}<br>
       Pares: ${pares} | Ímpares: ${impares}<br>
       Faixas: ${faixas.join(" / ")}<br>
       Soma média: ${Math.round(soma/concursos.length)}`;

    premio.innerText=d.acumulado
      ?`Acumulado: R$ ${d.valorEstimadoProximoConcurso?.toLocaleString("pt-BR")}`
      :`Saiu: R$ ${d.valorPremio?.toLocaleString("pt-BR")}`;
  }catch{
    alert("Erro ao buscar concursos.");
  }
}

/* ===== Análise do jogo ===== */
function analisar(jogo){
  let pares=jogo.filter(n=>n%2===0).length;
  let soma=jogo.reduce((a,b)=>a+b,0);
  let base=concursos[simulacaoSelect.value]||[];
  let rep=jogo.filter(n=>base.includes(n)).length;

  let score=0;
  if(pares===7||pares===8)score++;
  if(soma>=180&&soma<=220)score++;
  if(rep>=6&&rep<=10)score++;

  let selo=score===3?"🟢 EXCELENTE":score===2?"🟡 REGULAR":"🔴 FORA DO PADRÃO";

  return `
    <div class="analise">
      Pares:${pares} | Soma:${soma} | Repetição:${rep}<br>
      Confiabilidade ${confianca()}%<br>
      <div class="selo">${selo}</div>
      <button onclick='simular(${JSON.stringify(jogo)})'>🔍 Simular resultado</button>
      <div class="simulacao" id="sim-${jogo.join("")}"></div>
    </div>`;
}

/* ===== Simulação ===== */
function simular(jogo){
  let base=concursos[simulacaoSelect.value]||[];
  let pontos=jogo.filter(n=>base.includes(n)).length;
  let el=document.getElementById("sim-"+jogo.join(""));
  el.innerHTML=`Simulação: ${pontos} pontos`;
}

/* ===== Gerar jogos ===== */
function gerarJogos(){
  let dezenas=+document.querySelector('input[name="dezenas"]:checked').value;
  let qtd=+qtdJogos.value;
  let html="";
  for(let i=0;i<qtd;i++){
    let j=[];
    while(j.length<dezenas){
      let n=Math.floor(Math.random()*25)+1;
      if(!j.includes(n))j.push(n);
    }
    j.sort((a,b)=>a-b);
    html+=`<div class="resultado">${j.map(n=>String(n).padStart(2,"0")).join(" - ")}${analisar(j)}</div>`;
  }
  saida.innerHTML=html;
}

/* ===== Avançado ===== */
function gerarAvancado(){
  let qtd=+qtdAvancado.value;
  let html="";
  for(let i=0;i<qtd;i++){
    let j=[];
    while(j.length<15){
      let n=Math.floor(Math.random()*25)+1;
      if(!j.includes(n))j.push(n);
    }
    j.sort((a,b)=>a-b);
    html+=`<div class="resultado">${j.join(" - ")}${analisar(j)}</div>`;
  }
  saidaAvancado.innerHTML=html;
}

/* ===== Fechamento ===== */
function gerarFechamento(){
  let tipo=+tipoFechamento.value;
  let html="";
  for(let i=0;i<tipo;i++){
    let j=[];
    while(j.length<15){
      let n=Math.floor(Math.random()*25)+1;
      if(!j.includes(n))j.push(n);
    }
    j.sort((a,b)=>a-b);
    html+=`<div class="resultado">${j.join(" - ")}${analisar(j)}</div>`;
  }
  saidaFechamento.innerHTML=html;
}
</script>

</body>
</html>
