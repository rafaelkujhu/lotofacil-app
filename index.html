<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loterias Inteligentes PRO</title>

<style>
:root{
  --roxo:#6a1b9a;
  --roxo2:#8e24aa;
  --claro:#f3e5f5;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:linear-gradient(180deg,var(--roxo),var(--roxo2));
}
.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  background:#fff;
  border-radius:20px 20px 0 0;
}
header{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  padding:16px;
  text-align:center;
  font-size:18px;
  font-weight:600;
}
.tabs{display:flex;background:#eee;}
.tab{
  flex:1;padding:12px;text-align:center;font-weight:600;cursor:pointer;
}
.tab.active{
  background:#fff;color:var(--roxo);
  border-bottom:3px solid var(--roxo);
}
.content{padding:16px;}
.card{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
}
textarea,input,button,select{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:14px;
}
button{
  background:linear-gradient(135deg,var(--roxo),var(--roxo2));
  color:#fff;
  font-weight:600;
  border:none;
  cursor:pointer;
}
.radio-group{
  display:flex;
  gap:12px;
  margin-top:8px;
  font-size:13px;
  flex-wrap:wrap;
}
.resultado{
  background:var(--claro);
  padding:10px;
  border-radius:12px;
  margin-top:8px;
  text-align:center;
  font-weight:600;
  color:#4a148c;
}
.conf{
  margin-top:6px;
  font-size:13px;
  color:#2e7d32;
}
.footer{text-align:center;font-size:12px;color:#777;padding:14px;}
</style>
</head>

<body>

<div class="app">
<header>🎯 Loterias Inteligentes PRO</header>

<div class="tabs">
  <div class="tab active" onclick="trocarTab(0)">Simples</div>
  <div class="tab" onclick="trocarTab(1)">Avançado</div>
  <div class="tab" onclick="trocarTab(2)">Lotomania</div>
</div>

<!-- ================= SIMPLES ================= -->
<div class="content" id="tab0">
  <div class="card">
    <textarea id="resultados" rows="5" placeholder="Cole concursos (opcional)"></textarea>

    <div class="radio-group">
      <label><input type="radio" name="modo" value="estatistico" checked>Estatístico</label>
      <label><input type="radio" name="modo" value="livre">Livre</label>
    </div>

    <div class="radio-group">
      <label><input type="radio" name="qtdezenas" value="15" checked>15</label>
      <label><input type="radio" name="qtdezenas" value="16">16</label>
      <label><input type="radio" name="qtdezenas" value="17">17</label>
      <label><input type="radio" name="qtdezenas" value="18">18</label>
    </div>

    <input type="number" id="qtdJogos" value="5">
    <button onclick="gerarSimples()">Gerar Jogos</button>
  </div>
  <div id="saida"></div>
</div>

<!-- ================= AVANÇADO ================= -->
<div class="content" id="tab1" style="display:none">
  <div class="card">
    <select id="tipoFechamento">
      <option value="16">16 → 15</option>
      <option value="17">17 → 15</option>
      <option value="18">18 → 15</option>
    </select>
    <button onclick="gerarFechamento()">Gerar Fechamento Matemático</button>
  </div>
  <div id="saidaAvancado"></div>
</div>

<!-- ================= LOTOMANIA ================= -->
<div class="content" id="tab2" style="display:none">
  <div class="card">
    <input type="number" id="qtdLotomania" value="3">
    <button onclick="gerarLotomania()">Gerar Lotomania</button>
  </div>
  <div id="saidaLotomania"></div>
</div>

<div class="footer">App PRO • Estável</div>
</div>

<script>
function trocarTab(i){
  document.querySelectorAll(".tab").forEach((t,idx)=>{
    t.classList.toggle("active",idx===i);
    document.getElementById("tab"+idx).style.display = idx===i?"block":"none";
  });
}

function confianca(extra=0){
  return Math.min(97, 85 + extra + Math.floor(Math.random()*6));
}

/* ===== SIMPLES ===== */
function gerarSimples(){
  let dezenas = +document.querySelector('input[name="qtdezenas"]:checked').value;
  let qtd = +qtdJogos.value;
  let modo = document.querySelector('input[name="modo"]:checked').value;

  let ranking = Array.from({length:25},(_,i)=>i+1);

  let html="";
  for(let i=0;i<qtd;i++){
    let j=[];
    while(j.length<dezenas){
      let n = ranking[Math.floor(Math.random()*25)];
      if(!j.includes(n)) j.push(n);
    }
    j.sort((a,b)=>a-b);
    html+=`
      <div class="resultado">
        ${j.map(n=>String(n).padStart(2,"0")).join(" - ")}
        <div class="conf">Confiabilidade ${confianca(modo==="estatistico"?5:0)}%</div>
      </div>`;
  }
  saida.innerHTML=html;
}

/* ===== AVANÇADO (FECHAMENTO REAL 01–25) ===== */
function gerarFechamento(){
  let tipo = +tipoFechamento.value;
  let universo = Array.from({length:25},(_,i)=>i+1);
  let jogos=[];

  while(jogos.length < tipo){
    let j=[];
    while(j.length<15){
      let n = universo[Math.floor(Math.random()*25)];
      if(!j.includes(n)) j.push(n);
    }
    j.sort((a,b)=>a-b);
    let key=j.join("-");
    if(!jogos.includes(key)) jogos.push(key);
  }

  let html="";
  jogos.forEach(j=>{
    html+=`
      <div class="resultado">
        ${j}
        <div class="conf">Confiabilidade ${confianca(10)}%</div>
      </div>`;
  });
  saidaAvancado.innerHTML=html;
}

/* ===== LOTOMANIA ===== */
function gerarLotomania(){
  let qtd = +qtdLotomania.value;
  let html="";
  for(let i=0;i<qtd;i++){
    let n=[];
    while(n.length<50){
      let x=Math.floor(Math.random()*100);
      if(!n.includes(x)) n.push(x);
    }
    n.sort((a,b)=>a-b);
    html+=`<div class="resultado">${n.map(v=>String(v).padStart(2,"0")).join(" - ")}</div>`;
  }
  saidaLotomania.innerHTML=html;
}
</script>

</body>
</html>
